# Publishes @envsave/cli to npm via trusted publishing (OIDC) — no npm token.
# Triggered by pushing a version tag (e.g. `bun run release` → pushes v1.0.54).
#
# One-time setup on npmjs.com:
#   @envsave/cli → Settings → Trusted Publisher → GitHub Actions
#     Organization or user: jcsancho
#     Repository:           envsave
#     Workflow filename:    release.yml
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # required for npm trusted publishing

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build

      - run: npm publish --access public
