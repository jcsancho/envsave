<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — eVault</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0a0a0a;
      color: #e5e5e5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #151515;
      border: 1px solid #252525;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 480px;
      margin: 24px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 8px; color: #fff; }
    .subtitle { color: #888; font-size: 0.9rem; margin-bottom: 32px; }
    label { display: block; color: #999; font-size: 0.85rem; margin-bottom: 6px; }
    input[type="email"] {
      width: 100%;
      padding: 12px 16px;
      background: #0a0a0a;
      border: 1px solid #333;
      border-radius: 8px;
      color: #e5e5e5;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="email"]:focus { border-color: #10b981; }
    .btn {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      background: #10b981;
      color: #000;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #34d399; }
    .btn-danger {
      background: transparent;
      border: 1px solid #ef4444;
      color: #ef4444;
      margin-top: 12px;
    }
    .btn-danger:hover { background: #ef4444; color: #000; }

    /* Sections */
    #lookup-section, #dashboard-section { transition: all 0.2s; }
    #dashboard-section { display: none; }
    #dashboard-section.show { display: block; }
    #lookup-section.hide { display: none; }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #1a1a1a;
    }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: #888; font-size: 0.85rem; }
    .info-value { color: #e5e5e5; font-size: 0.85rem; font-family: monospace; }

    .token-box {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.85rem;
      color: #fff;
      background: #0a0a0a;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #252525;
      word-break: break-all;
      margin: 16px 0;
      cursor: pointer;
    }
    .token-box:hover { border-color: #10b981; }

    .error { color: #ef4444; font-size: 0.85rem; margin-top: 12px; display: none; }
    .error.show { display: block; }
    .success { color: #10b981; font-size: 0.85rem; margin-top: 12px; display: none; }
    .success.show { display: block; }
    .back { display: block; margin-top: 20px; color: #888; text-decoration: none; font-size: 0.85rem; text-align: center; }
    .back:hover { color: #e5e5e5; }
  </style>
</head>
<body>
  <div class="card">
    <!-- Lookup Section -->
    <div id="lookup-section">
      <h1>Dashboard</h1>
      <p class="subtitle">Enter your email to view your license.</p>
      <form id="lookup-form">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com" required>
        <div class="error" id="lookup-error"></div>
        <button type="submit" class="btn">Look Up</button>
      </form>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboard-section">
      <h1>Your License</h1>

      <div class="info-row">
        <span class="info-label">Email</span>
        <span class="info-value" id="dash-email"></span>
      </div>
      <div class="info-row">
        <span class="info-label">Created</span>
        <span class="info-value" id="dash-created"></span>
      </div>
      <div class="info-row">
        <span class="info-label">Expires</span>
        <span class="info-value" id="dash-expires"></span>
      </div>

      <p style="color: #888; font-size: 0.8rem; margin-top: 16px;">Click token to copy:</p>
      <div class="token-box" id="dash-token"></div>

      <button class="btn btn-danger" id="regen-btn">Regenerate Token</button>
      <div class="success" id="regen-success">Token regenerated! Update your CLI with the new token.</div>
      <div class="error" id="regen-error"></div>
    </div>

    <a class="back" href="/">← Back to eVault</a>
  </div>

  <script>
    const lookupSection = document.getElementById('lookup-section');
    const dashSection = document.getElementById('dashboard-section');
    const lookupForm = document.getElementById('lookup-form');
    const lookupError = document.getElementById('lookup-error');
    let currentEmail = '';

    lookupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      lookupError.classList.remove('show');
      currentEmail = document.getElementById('email').value;

      try {
        const res = await fetch('/api/license/dashboard', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: currentEmail }),
        });

        const data = await res.json();
        if (data.error) {
          lookupError.textContent = data.error;
          lookupError.classList.add('show');
          return;
        }

        document.getElementById('dash-email').textContent = data.email;
        document.getElementById('dash-created').textContent = data.createdAt;
        document.getElementById('dash-expires').textContent = data.expiresAt || 'Never';
        document.getElementById('dash-token').textContent = data.token;

        lookupSection.classList.add('hide');
        dashSection.classList.add('show');
      } catch {
        lookupError.textContent = 'Network error.';
        lookupError.classList.add('show');
      }
    });

    // Copy token
    document.getElementById('dash-token').addEventListener('click', (e) => {
      navigator.clipboard.writeText(e.target.textContent);
      e.target.style.borderColor = '#10b981';
      setTimeout(() => e.target.style.borderColor = '', 1000);
    });

    // Regenerate
    document.getElementById('regen-btn').addEventListener('click', async () => {
      const success = document.getElementById('regen-success');
      const error = document.getElementById('regen-error');
      success.classList.remove('show');
      error.classList.remove('show');

      try {
        const res = await fetch('/api/license/regenerate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: currentEmail }),
        });

        const data = await res.json();
        if (data.token) {
          document.getElementById('dash-token').textContent = data.token;
          success.classList.add('show');
        } else {
          error.textContent = data.error || 'Failed to regenerate.';
          error.classList.add('show');
        }
      } catch {
        error.textContent = 'Network error.';
        error.classList.add('show');
      }
    });
  </script>
</body>
</html>
