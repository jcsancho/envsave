[project]
name = "envsave"
version = "1.0.0"
description = "Local secret vault for LLM-safe environments — encrypted secrets that agents can't bulk-discover"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["cryptography>=41.0"]
keywords = ["vault", "secrets", "encryption", "llm", "security"]

[project.urls]
Homepage = "https://github.com/jcsancho/envsave"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["envsave"]
